# Go Service (chi). RABBITMQ_URL deliberately unset → the messaging patterns
# use the in-process buffer fallback (.env.example documents the same switch).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-service
  namespace: demo-microservices
  labels:
    app: go-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-service
  template:
    metadata:
      labels:
        app: go-service
    spec:
      containers:
        - name: go-service
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/demo-go-service:${TAG}
          ports:
            - containerPort: 5002
          env:
            - name: EUREKA_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key: EUREKA_SERVER_URL
            # RABBITMQ_URL deliberately unset → buffer fallback (see header)
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "250m"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 5002
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: go-service
  namespace: demo-microservices
  labels:
    app: go-service
spec:
  type: ClusterIP
  selector:
    app: go-service
  ports:
    - name: http
      port: 5002
      targetPort: 5002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-service
  namespace: demo-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-service
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
