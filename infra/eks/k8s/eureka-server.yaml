# Eureka Server — service discovery. Single replica (a demo needs one).
#
# Differences vs docker-compose (intentional, documented in k8s/README.md):
#   - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE stays as compose sets it so
#     the health probe path (/actuator/health) exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: demo-microservices
  labels:
    app: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/demo-eureka-server:${TAG}
          ports:
            - containerPort: 8761
          env:
            - name: EUREKA_CLIENT_REGISTERWITHEUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCHREGISTRY
              value: "false"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,metrics"
            - name: LOGGING_LEVEL_COM_NETFLIX_EUREKA
              value: "INFO"
          # Fargate bills by pod size — requests == limits (recommended there)
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          # Spring Boot JVM on Fargate cold boots slowly — the startup probe
          # gives it 4 minutes before liveness kicks in.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            periodSeconds: 10
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: demo-microservices
  labels:
    app: eureka-server
spec:
  # ClusterIP: Eureka is only needed inside the cluster (services register
  # with it; humans use port-forward to see the console).
  type: ClusterIP
  selector:
    app: eureka-server
  ports:
    - name: http
      port: 8761
      targetPort: 8761
