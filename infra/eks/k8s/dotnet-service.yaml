# .NET Service (ASP.NET Core + Steeltoe). No degraded patterns yet — it is
# the contract-first service (/info, /health, POST /process).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-service
  namespace: demo-microservices
  labels:
    app: dotnet-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnet-service
  template:
    metadata:
      labels:
        app: dotnet-service
    spec:
      containers:
        - name: dotnet-service
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/demo-dotnet-service:${TAG}
          ports:
            - containerPort: 5003
          env:
            - name: EUREKA_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key: EUREKA_SERVER_URL
            - name: SERVICE_HOSTNAME
              value: "dotnet-service"
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "500m"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 5003
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-service
  namespace: demo-microservices
  labels:
    app: dotnet-service
spec:
  type: ClusterIP
  selector:
    app: dotnet-service
  ports:
    - name: http
      port: 5003
      targetPort: 5003
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dotnet-service
  namespace: demo-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dotnet-service
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
