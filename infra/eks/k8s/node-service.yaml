# Node Service (Express). Same story as java-service: REDIS_URL unset →
# cache-dependent patterns degrade; contract + pattern routes work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-service
  namespace: demo-microservices
  labels:
    app: node-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-service
  template:
    metadata:
      labels:
        app: node-service
    spec:
      containers:
        - name: node-service
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/demo-node-service:${TAG}
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: demo-secrets
                  key: JWT_SECRET
            - name: METRICS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key: METRICS_ENABLED
            - name: RATE_LIMIT_REQUESTS_PER_MINUTE
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key: RATE_LIMIT_REQUESTS_PER_MINUTE
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "250m"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: node-service
  namespace: demo-microservices
  labels:
    app: node-service
spec:
  type: ClusterIP
  selector:
    app: node-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: node-service
  namespace: demo-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: node-service
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
