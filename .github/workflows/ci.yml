# CI for demo-microservices
#
# Builds and tests every service family, lints shell scripts, validates the
# maintained Terraform stack, and runs the repo's own validation scripts.
#
# Terraform scope: the maintained stacks ONLY (infra/serverless, infra/eks).
# The legacy root stack and infra/docker are deprecated/quarantined — see
# infra/README.md — and must not be added to this job.
#
# Note: local JDK is 11 but every pom targets Java 22 — the java jobs only
# run here, not on the WSL dev box. demo-lambda-java-service has a pom but
# no Maven wrapper and is built by scripts/build-lambda-zips.sh instead.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-scripts:
    name: Shell scripts (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every shell script
        run: |
          status=0
          while IFS= read -r -d '' f; do
            echo "bash -n $f"
            bash -n "$f" || status=1
          done < <(find . -type f -name '*.sh' \
                     -not -path './.git/*' \
                     -not -path '*/node_modules/*' \
                     -not -path '*/venv/*' -print0)
          exit $status

  java:
    name: Java — ${{ matrix.dir }} (${{ matrix.goal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: demo-java-service
            goal: test
          - dir: demo-eureka-server
            goal: test
          - dir: demo-gateway-service
            goal: test
          - dir: demo-simple-java-service
            goal: package -DskipTests
          - dir: demo-simple-eureka-server
            goal: package -DskipTests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: ./mvnw -B -ntp ${{ matrix.goal }}

  node:
    name: Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: demo-node-service — install, syntax-check, test
        working-directory: demo-node-service
        run: |
          npm ci
          node --check app.js
          node --test tests/*.test.js
      - name: Syntax-check simple + lambda entrypoints
        run: |
          node --check demo-simple-node-service/app.js
          node --check demo-lambda-node-service/handler.js
          find demo-node-service/patterns demo-simple-node-service \
               -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r demo-python-service/requirements.txt pytest
      - name: Compile all Python sources
        run: |
          python -m compileall -q \
            demo-python-service/app.py \
            demo-python-service/patterns \
            demo-simple-python-service \
            demo-lambda-python-service
      - name: demo-python-service — tests
        working-directory: demo-python-service
        run: python -m pytest tests/ -q

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      # go.sum is deliberately not committed (see demo-go-service/go.mod), so
      # tidy resolves dependencies in CI before building.
      - name: Build all Go modules
        run: |
          for mod in demo-go-service demo-simple-go-service; do
            echo "== $mod =="
            (cd "$mod" && go mod tidy && go build ./...)
          done

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Build is the smoke test (no test project yet). Restore runs inside the
      # build and is the real verifier for the Steeltoe package pin.
      - name: Build demo-dotnet-service
        working-directory: demo-dotnet-service
        run: dotnet build

  terraform:
    name: Terraform — ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [infra/serverless, infra/eks]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: fmt -check
        run: terraform -chdir=${{ matrix.stack }} fmt -check -recursive
      # infra/eks declares `backend "s3" {}` with no config — inert under
      # -backend=false, so validate needs no cluster or AWS credentials.
      - name: init + validate
        run: |
          terraform -chdir=${{ matrix.stack }} init -backend=false -input=false
          terraform -chdir=${{ matrix.stack }} validate

  k8s-manifests:
    name: k8s manifests — render + YAML parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install envsubst + PyYAML
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gettext-base
          pip install pyyaml
      - name: Render with dummy values and parse every object
        run: |
          AWS_ACCOUNT_ID=000000000000 AWS_REGION=us-east-1 TAG=ci ./scripts/render-k8s.sh > /tmp/rendered.yaml
          python - <<'EOF'
          import yaml

          text = open("/tmp/rendered.yaml").read()
          assert "${" not in text, "unsubstituted ${...} placeholder left in rendered output"

          docs = [d for d in yaml.safe_load_all(text) if d]
          kinds = {}
          for d in docs:
              assert isinstance(d, dict) and d.get("kind"), f"object without kind: {d!r}"
              assert d.get("metadata", {}).get("name"), f"object without metadata.name: {d['kind']}"
              kinds[d["kind"]] = kinds.get(d["kind"], 0) + 1

          print(f"parsed {len(docs)} objects: {kinds}")
          assert kinds.get("Namespace") == 1
          assert kinds.get("ConfigMap") == 1 and kinds.get("Secret") == 1
          assert kinds.get("Deployment") == 7 and kinds.get("Service") == 7
          assert kinds.get("HorizontalPodAutoscaler") == 5
          EOF

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The compose file declares `env_file: .env`, which is gitignored —
      # `docker compose config` fails outright without it. Materialize the
      # placeholder template exactly as a fresh clone would.
      - name: Materialize .env from the template
        run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config -q

  validation-scripts:
    name: Repo validation scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate-security.sh
        run: bash validate-security.sh
      - name: pattern-gap-analysis.sh
        run: bash pattern-gap-analysis.sh

  docker-build:
    name: docker build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - demo-eureka-server
          - demo-gateway-service
          - demo-java-service
          - demo-node-service
          - demo-python-service
          - demo-go-service
          - demo-dotnet-service
    steps:
      - uses: actions/checkout@v4
      - name: Build image (build only — deploy.yml pushes to ECR)
        run: docker build -t ${{ matrix.service }}:ci ${{ matrix.service }}
